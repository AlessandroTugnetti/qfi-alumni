title: QFI Alumni & Students Association
description: A community for students and alumni of the MSc in Quantitative Finance and Insurance at the University of Turin.
lang: en
url: https://alessandrotugnetti.github.io
baseurl: /qfi-alumni
theme: al_folio_core
plugins:
  - al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
