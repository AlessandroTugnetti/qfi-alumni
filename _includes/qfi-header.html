<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo-qfi.png' | relative_url }}" width="1390" height="310" alt="QFI Alumni &amp; Students Association, home">
    </a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        {% assign nav_pages = site.pages | where_exp: 'item', 'item.nav_order' | sort: 'nav_order' %}
        {% for item in nav_pages %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.nav_title | default: item.title | escape }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden>
      <svg class="moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/>
      </svg>
      <svg class="sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</header>
